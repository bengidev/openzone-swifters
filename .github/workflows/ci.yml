name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: OpenZone
  PROJECT: OpenZone.xcodeproj

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.5.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            SourcePackages
            DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('OpenZone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Trust Swift macros (TCA and dependencies)
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Pick iOS simulator
        id: sim
        run: |
          cat > /tmp/pick_sim.py <<'PY'
          import json, subprocess
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          devices = json.loads(out)["devices"]
          ids = [d["udid"] for rt, devs in devices.items() if "iOS" in rt
                 for d in devs if d.get("isAvailable")]
          print(ids[0] if ids else "")
          PY
          DEST=$(python3 /tmp/pick_sim.py)
          echo "Using simulator: $DEST"
          echo "udid=$DEST" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run unit tests (UI tests excluded via scheme)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -only-testing:OpenZoneTests \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          if [ ! -f .swiftlint.yml ]; then
            echo "::error::.swiftlint.yml is missing — lint is a required gate."
            exit 1
          fi
          brew install swiftlint
          swiftlint lint
